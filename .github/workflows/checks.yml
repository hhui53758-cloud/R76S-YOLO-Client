name: Project checks
env:
  PYTHONUTF8: '1'
on:
  push:
  pull_request:
jobs:
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r windows_client/requirements.txt
      - run: python scripts/check_project.py
      - run: python windows_client/smoke_test.py
      - run: python windows_client/workflow_test.py
      - run: python windows_client/remote_backend_test.py
      - shell: pwsh
        run: |
          Get-ChildItem windows_client -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
